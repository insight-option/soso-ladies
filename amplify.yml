version: 1
# AWS Amplify Hosting build spec (Amplify Gen 2 + Next.js SSR).
# 1) backend: deploys amplify/ (Cognito, AppSync/DynamoDB, S3) for this branch
#    and writes amplify_outputs.json.
# 2) frontend: builds Next.js, which reads amplify_outputs.json.
# Node 22 ships npm 10; package-lock.json is kept valid for `npm ci` on npm 10.
backend:
  phases:
    build:
      commands:
        - nvm install 22
        - node -v && npm -v
        - npm ci --cache .npm --prefer-offline
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
      - node_modules/**/*
